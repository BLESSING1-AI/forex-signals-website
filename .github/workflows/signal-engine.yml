name: Price Action Signal Engine

on:
  schedule:
    # Every 15 min through active gold hours (UTC weekdays)
    - cron: "0,15,30,45 0-22 * * 1-5"
    # Extra density around US data / NY (UTC 11-20)
    - cron: "5,10,20,25,35,40,50,55 11-20 * * 1-5"
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install
        working-directory: engine
        run: pip install -r requirements.txt
      - name: Run
        working-directory: engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python signal_engine.py
