name: Price Action Signal Engine

on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore signal state
        uses: actions/cache@v4
        with:
          path: engine/.signal_state.json
          key: signal-state-${{ runner.os }}-v2
          restore-keys: |
            signal-state-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install
        working-directory: engine
        run: pip install -r requirements.txt

      - name: Run
        working-directory: engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "-1004499950812"
        run: python signal_engine.py

      - name: Save signal state
        if: always()
        uses: actions/cache@v4
        with:
          path: engine/.signal_state.json
          key: signal-state-${{ runner.os }}-v2
