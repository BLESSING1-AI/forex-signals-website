name: Price Action Signal Engine

on:
  schedule:
    # More frequent during active market hours (UTC)
    # GitHub can delay cron; multiple entries improve reliability
    - cron: "0,30 6-21 * * 1-5"   # every 30 min, 06:00-21:30 UTC weekdays
    - cron: "15,45 11-14 * * 1-5" # extra around typical US data window
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Engine
        working-directory: engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python signal_engine.py

      - name: Summary
        if: always()
        run: echo "Cycle finished at $(date -u)"
