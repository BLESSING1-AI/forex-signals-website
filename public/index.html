<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Price Action Signals – Gold &amp; BTC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{gold:{400:'#fbbf24',500:'#f59e0b'},btc:{400:'#f7931a'}}}}}</script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<nav class="border-b border-slate-800 sticky top-0 bg-slate-950/90 backdrop-blur z-50">
  <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-gold-400 to-amber-600 text-slate-900 font-bold text-sm flex items-center justify-center">PA</div>
      <div><div class="font-semibold">Price Action Signals</div><div class="text-xs text-slate-500">XAUUSD · BTCUSD</div></div>
    </div>
    <a href="https://t.me/PriceActionSignalsHub" class="text-sm px-3 py-1.5 rounded-lg bg-gold-500 text-slate-900 font-medium" target="_blank" rel="noopener">Telegram</a>
  </div>
</nav>
<main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
  <header class="text-center">
    <p class="text-xs text-slate-500 mb-2">TP1 closest · TP3 furthest · BE after TP1</p>
    <h1 class="text-3xl font-bold">Gold &amp; Bitcoin signals</h1>
  </header>
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500">PAIRS</p><p class="font-semibold text-gold-400">XAU · BTC</p></div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500">ACTIVE</p><p id="stat-active" class="font-semibold">0</p></div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500">WIN RATE</p><p id="stat-wr" class="font-semibold">—</p></div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4"><p class="text-xs text-slate-500">AVG R</p><p id="stat-ar" class="font-semibold">—</p></div>
  </div>
  <div class="flex gap-2 text-sm" id="filters">
    <button data-filter="ALL" class="filter-btn px-3 py-1.5 rounded-lg bg-gold-500 text-slate-900 font-medium">All</button>
    <button data-filter="XAUUSD" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-800">XAU</button>
    <button data-filter="BTCUSD" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-800">BTC</button>
  </div>
  <div id="signal-list" class="space-y-4 text-slate-500 text-sm">Loading…</div>
  <div id="closed-list" class="text-sm text-slate-400"></div>
</main>
<script>
let allSignals=[],currentFilter='ALL';
function card(s){const p=s.pair||'XAUUSD';return`<article class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><b class="${p==='BTCUSD'?'text-btc-400':'text-gold-400'}">${p}</b> ${s.direction} · ${s.tier||''}<div class="text-sm mt-2">In ${s.entry_zone} SL ${s.stop_loss}<br>TP1 ${s.tp1} | TP2 ${s.tp2} | TP3 ${s.tp3}</div></article>`}
function render(){const list=document.getElementById('signal-list');const items=allSignals.filter(s=>currentFilter==='ALL'||(s.pair||'XAUUSD')===currentFilter);list.innerHTML=items.length?items.map(card).join(''):'<p class="text-slate-500">No active setups. Live on Telegram.</p>'}
document.getElementById('filters').onclick=e=>{const b=e.target.closest('.filter-btn');if(!b)return;currentFilter=b.dataset.filter;render()};
async function load(){try{const data=await(await fetch('signals.json?t='+Date.now(),{cache:'no-store'})).json();allSignals=[...(data.signals||[]),...(data.watchlist||[])];document.getElementById('stat-active').textContent=String((data.signals||[]).length);const st=data.stats||{};document.getElementById('stat-wr').textContent=st.win_rate!=null?st.win_rate+'%':'—';document.getElementById('stat-ar').textContent=st.avg_r!=null?st.avg_r:'—';render()}catch(e){}}
load();setInterval(load,60000);
</script>
</body>
</html>
